name: Windows source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-json-c mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-libvorbis
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMEMENTO_MECAB_SUPPORT=OFF -DMEMENTO_OCR_SUPPORT=OFF -DMEMENTO_TEST_PROFILE=OFF -DMEMENTO_BUILD_ENGLISH_TESTS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
